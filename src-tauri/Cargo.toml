[package]
name = "foldmark"
version = "0.1.0"
description = "FoldMark - a lightweight local-first Markdown reader"
authors = ["Xiaoyan"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "foldmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
notify = "8.2"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.22"
