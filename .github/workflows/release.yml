name: Build release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: FoldMark v__VERSION__
          releaseBody: |
            FoldMark 是一款轻量、本地优先的 Markdown 阅读器。

            ## 下载

            - macOS：下载 `universal.dmg`，同时支持 Apple Silicon 与 Intel Mac。
            - Windows：下载 `x64-setup.exe`，适用于 64 位 Windows。
            - `Source code` 是供开发者使用的源码，普通用户不需要下载。

            ## 首次打开

            当前安装包未进行商业代码签名。macOS 如果拦截，请在 Finder 中右键应用并选择“打开”；Windows 如出现 SmartScreen，请确认下载来源为本仓库后选择“仍要运行”。

            详细变更请参阅仓库中的 CHANGELOG。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
